<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<script>
  // Set the theme before paint so there's no flash of the wrong one.
  (function () {
    var saved = localStorage.getItem('job-digest-theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- Setup wizard: shown until GET /api/status returns setupComplete:true -->
<div class="wizard-overlay" id="wizard" hidden>
  <div class="wizard-card panel" id="wizard-content"></div>
</div>

<!-- Browse-before-signup: a no-profile preview of live roles, reachable from
     the wizard's welcome step without entering any personal info. -->
<div class="browse-shell" id="browse-preview" hidden>
  <header class="topbar">
    <h1>Browse open roles</h1>
    <button class="btn primary" id="browse-setup-btn">Set up my profile</button>
  </header>
  <main class="main" id="browse-main"></main>
</div>

<!-- Main shell: hidden until setup is complete -->
<div class="shell" id="shell" hidden>
  <nav class="sidebar" id="sidebar">
    <div class="product-mark">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 2h10l4 4v16H5V2z"/>
          <path d="M15 2v4h4"/>
          <circle cx="10" cy="9" r="1.6"/>
          <path d="M7.3 13.2c.4-1.8 1.6-2.6 2.7-2.6s2.3.8 2.7 2.6"/>
          <path d="M13.5 9.5h3M13.5 12h3"/>
          <path d="M7 16.5c1-1 1.6-.4 2.3 0s1.4 1 2.4 0 1.6-1.6 2.6-1 1.4 1.2 2.2.6"/>
        </svg>
      </span>
      <span class="name">Job Digest</span>
    </div>
    <div class="nav" id="nav">
      <a href="#/home" data-view="home">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </a>
      <a href="#/digest" data-view="digest">
        <svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-6 6v4l-2 4h16l-2-4V8a6 6 0 0 0-6-6z"/><path d="M9 20a3 3 0 0 0 6 0"/></svg>
        Job Digest
      </a>
      <a href="#/saved" data-view="saved">
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
        Saved Jobs
      </a>
      <a href="#/applications" data-view="applications">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg>
        Applications
      </a>
      <a href="#/cv-letters" data-view="cv-letters">
        <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6V2z"/><path d="M9 13h6M9 17h6"/></svg>
        CV and Cover Letters
      </a>
      <a href="#/profile" data-view="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Profile &amp; Preferences
      </a>
    </div>
    <div class="sidebar-footer" id="sidebar-footer">—</div>
    <a href="#/profile" class="sidebar-edit-btn">Edit</a>
  </nav>

  <header class="topbar">
    <div class="topbar-title-group">
      <h1 id="topbar-title">Home</h1>
      <span class="count-chip-topbar" id="topbar-count" hidden></span>
    </div>
    <div class="freshness" id="freshness">
      <span id="freshness-text">—</span>
      <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M20 11A8 8 0 1 0 18.5 16"/><path d="M20 5v6h-6"/></svg>
      </button>
      <button class="btn-run-now" id="run-now-btn">
        <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg>
        Run now
      </button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode">
        <svg id="theme-icon-sun" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="theme-icon-moon" viewBox="0 0 24 24" stroke-width="1.8" hidden><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="main" id="main"></main>
</div>

<script src="js/app.js"></script>
</body>
</html>
